<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Michis Espaciales</title>
  <meta name="description" content="Michis Espaciales">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .fallback {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      text-align: center;
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      pointer-events: none;
    }

    .fallback a {
      color: #fff;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <main class="page">
    <iframe
      src="https://elfarostudios.mx/michis_espaciales/"
      title="Michis Espaciales"
      loading="eager"
      allow="autoplay; fullscreen; clipboard-read; clipboard-write"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>

  <div class="fallback">
    Si no carga correctamente, abre directamente
    <a href="https://elfarostudios.mx/michis_espaciales/" target="_blank" rel="noopener noreferrer">Michis Espaciales</a>.
