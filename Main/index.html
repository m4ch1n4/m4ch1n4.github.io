    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
    body.noscroll{overflow:hidden}
    #demo5{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:1}
    #initial-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-start;background:#000;padding:2em;overflow:hidden}
    #loader-text{display:block;color:#1ff042;font-family:Consolas,"Andale Mono","Lucida Console","Courier New",monospace;font-size:.9rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;text-shadow:0 0 2px rgba(31,240,66,.75)}
    #loader-text:before{content:"> "}
    #loader-text:after{display:inline-block;vertical-align:-.15em;width:.75em;height:1em;margin-left:5px;background:#1ff042;box-shadow:1px 1px 1px rgba(31,240,66,.65),-1px -1px 1px rgba(31,240,66,.65),1px -1px 1px rgba(31,240,66,.65),-1px 1px 1px rgba(31,240,66,.65);animation:cursor-blink 1.25s steps(1) infinite;content:""}
    @keyframes cursor-blink{0%,100%{opacity:0}50%{opacity:1}}
    #main-body{position:fixed;inset:0;z-index:9998;pointer-events:none;overflow:hidden}
    #main-body canvas#loader{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;display:block!important;z-index:9998!important}
    .ajax{position:fixed;inset:0;z-index:0;display:grid;place-items:center;overflow:hidden;background:#000;color:#eee;pointer-events:none}
    .ajax:before,.ajax:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(149,56,255,.5)}
    .ajax:before{width:min(72vw,760px);aspect-ratio:1;box-shadow:0 0 0 72px rgba(184,255,22,.025),inset 0 0 90px rgba(149,56,255,.055)}
    .ajax:after{width:min(48vw,500px);aspect-ratio:1;border-style:dashed;border-color:rgba(184,255,22,.42)}
    .loader-preview{position:relative;z-index:2;text-align:center;font-family:Consolas,"Courier New",monospace;text-transform:uppercase;letter-spacing:.15em}
    .loader-preview strong{display:block;font-family:Baskerville,Georgia,serif;font-size:clamp(4rem,11vw,10rem);font-weight:400;line-height:.86;letter-spacing:-.06em;text-transform:none}
    .loader-preview span{display:block;margin-top:1.2rem;color:#b8ff16;font-size:.65rem;letter-spacing:.2em}
    @media(max-width:641px){#initial-loader{padding:25px}#loader-text{font-size:.6rem}}
    @media(prefers-reduced-motion:reduce){#loader-text:after{animation:none}}

<body class="noscroll">
  <iframe id="demo5" src="/demo_5/" title="M4CH1N4 — Alquimista digital"></iframe>

  <div class="ajax" aria-hidden="true">
    <div class="loader-preview"><strong>M4CH1N4</strong><span>INIT_SEQUENCE / MMXXVI</span></div>
  </div>
  <div id="main-body" aria-hidden="true"></div>
  <div id="initial-loader" class="padded"><span id="loader-text"></span></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r70/three.min.js"></script>

  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/t-18/EffectComposer.js"></script>
  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/t-18/RenderPass.js"></script>
  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/t-18/ShaderPass.js"></script>
  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/t-18/MaskPass.js"></script>
  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/141552/08_texturepass.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/velocity/1.2.2/velocity.min.js"></script>
  <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/t-18/GlitchPass.js"></script>
  <script src="./script.backup.js"></script>
  <script>
  (()=>{
    const frame=document.getElementById('demo5');
    const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
    const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a));return t*t*(3-2*t)};

    function installIntro(){
      const win=frame.contentWindow;
      const doc=frame.contentDocument;
      if(!win||!doc) return;

      if(!doc.getElementById('m4-practice-type-style')){
        const practiceStyle=doc.createElement('style');
        practiceStyle.id='m4-practice-type-style';
        practiceStyle.textContent=`
          #practica .about-copy h2 .m4-old-type{
            font-family:"Old Times American Titling W00","American Typewriter","Nimbus Mono PS","Courier New",monospace;
            font-weight:400;
            letter-spacing:.02em;
            text-transform:uppercase;
          }
        `;
        doc.head.appendChild(practiceStyle);

        const practiceTitle=doc.querySelector('#practica .about-copy h2');
        if(practiceTitle&&!practiceTitle.querySelector('.m4-old-type')){
          practiceTitle.innerHTML=practiceTitle.innerHTML.replace('M4CH1N4','<span class="m4-old-type">M4CH1N4</span>');
        }
      }

      if(doc.getElementById('m4-hero-intro-style')) return;

      const hero=doc.querySelector('.hero');
      const grid=doc.querySelector('.hero-grid');
      const copy=doc.querySelector('.hero-copy');
      const apparatus=doc.querySelector('.apparatus');
      if(!hero||!grid||!copy||!apparatus) return;

      const reduced=win.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const mobile=win.matchMedia('(max-width:760px)').matches;
      if(reduced||mobile) return;

      const style=doc.createElement('style');
      style.id='m4-hero-intro-style';
      style.textContent=`
        .hero{height:185svh!important;min-height:0!important;padding:0!important;display:block!important;align-items:initial!important}
        .hero-grid{position:sticky!important;top:0!important;height:100svh!important;align-items:end!important;padding-top:148px!important;padding-bottom:72px!important}
        .hero-copy{opacity:0;transform:translate3d(0,58px,0);will-change:opacity,transform}
        .hero-copy>*{opacity:0;transform:translate3d(0,24px,0);will-change:opacity,transform}
        .apparatus{will-change:transform,opacity;transform-origin:center center}
      `;
      doc.head.appendChild(style);

      copy.classList.add('visible');
      apparatus.classList.add('visible');
      const parts=[...copy.children];
      let natural={x:0,y:0};

      function measure(){
        apparatus.style.transform='none';
        const r=apparatus.getBoundingClientRect();
        natural.x=r.left+r.width/2;
        natural.y=r.top+r.height/2;
      }

      function update(){
        const r=hero.getBoundingClientRect();
        const distance=Math.max(1,hero.offsetHeight-win.innerHeight);
        const p=clamp(-r.top/distance);
        const travel=smooth(.03,.72,p);
        const dx=win.innerWidth/2-natural.x;
        const dy=win.innerHeight/2-natural.y;
        const scale=1.32-(.32*travel);

        apparatus.style.transform=`translate3d(${dx*(1-travel)}px,${dy*(1-travel)}px,0) scale(${scale})`;
        apparatus.style.opacity=String(1-smooth(.94,1,p)*.08);

        const copyP=smooth(.22,.78,p);
        copy.style.opacity=String(copyP);
        copy.style.transform=`translate3d(0,${(1-copyP)*58}px,0)`;

        parts.forEach((el,i)=>{
          const local=smooth(.20+i*.065,.46+i*.075,p);
          el.style.opacity=String(local);
          el.style.transform=`translate3d(0,${(1-local)*24}px,0)`;
        });
      }

      let ticking=false;
      const requestUpdate=()=>{
        if(ticking) return;
        ticking=true;
        win.requestAnimationFrame(()=>{ticking=false;update()});
      };

      measure();
      update();
      win.addEventListener('scroll',requestUpdate,{passive:true});
      win.addEventListener('resize',()=>{measure();requestUpdate()});
    }

    frame.addEventListener('load',installIntro);
    try{installIntro()}catch(error){}
  })();
  </script>
</body>
