<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>INIT M4CH1N4</title>
  <meta name="description" content="M4CH1N4 — alquimia digital, imagen, espacio, tecnología y narrativa.">
  <meta name="theme-color" content="#000000">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
    body.noscroll{overflow:hidden}
    #demo5{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:1}
    #initial-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-start;background:#000;padding:2em;overflow:hidden}
    #loader-text{display:block;color:#1ff042;font-family:Consolas,"Andale Mono","Lucida Console","Courier New",monospace;font-size:.9rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;text-shadow:0 0 2px rgba(31,240,66,.75)}
    #loader-text:before{content:"> "}
    #loader-text:after{display:inline-block;vertical-align:-.15em;width:.75em;height:1em;margin-left:5px;background:#1ff042;box-shadow:1px 1px 1px rgba(31,240,66,.65),-1px -1px 1px rgba(31,240,66,.65),1px -1px 1px rgba(31,240,66,.65),-1px 1px 1px rgba(31,240,66,.65);animation:cursor-blink 1.25s steps(1) infinite;content:""}
    @keyframes cursor-blink{0%,100%{opacity:0}50%{opacity:1}}
    #main-body{position:fixed;inset:0;z-index:9998;pointer-events:none;overflow:hidden}
    #main-body canvas#loader{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;display:block!important;z-index:9998!important}
    .ajax{position:fixed;inset:0;z-index:0;display:grid;place-items:center;overflow:hidden;background:#000;color:#eee;pointer-events:none}
    .ajax:before,.ajax:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(149,56,255,.5)}
    .ajax:before{width:min(72vw,760px);aspect-ratio:1;box-shadow:0 0 0 72px rgba(184,255,22,.025),inset 0 0 90px rgba(149,56,255,.055)}
    .ajax:after{width:min(48vw,500px);aspect-ratio:1;border-style:dashed;border-color:rgba(184,255,22,.42)}
    .loader-preview{position:relative;z-index:2;text-align:center;font-family:Consolas,"Courier New",monospace;text-transform:uppercase;letter-spacing:.15em}
    .loader-preview strong{display:block;font-family:Baskerville,Georgia,serif;font-size:clamp(4rem,11vw,10rem);font-weight:400;line-height:.86;letter-spacing:-.06em;text-transform:none}
    .loader-preview span{display:block;margin-top:1.2rem;color:#b8ff16;font-size:.65rem;letter-spacing:.2em}
    @media(max-width:641px){#initial-loader{padding:25px}#loader-text{font-size:.6rem}}
    @media(prefers-reduced-motion:reduce){#loader-text:after{animation:none}}
  </style>
</head>
<body class="noscroll">
  <iframe id="demo5" src="/demo_5/" title="M4CH1N4 — Alquimista digital"></iframe>

  <div class="ajax" aria-hidden="true">

  </div>
  <div id="main-body" aria-hidden="true"></div>
  <div id="initial-loader" class="padded"><span id="loader-text"></span></div>
